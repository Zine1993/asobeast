name: Build trifun web
on:
  push:
    branches: [trifun-store-links]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zine1993/asobeast-web:trifun-store-links
          labels: |
            org.opencontainers.image.source=https://github.com/Zine1993/asobeast
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=trifun-web
          cache-to: type=gha,mode=max,scope=trifun-web
